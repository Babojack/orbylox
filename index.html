<!doctype html>
<!--
  Der Kopf, den JEDE Adresse der Einzelseiten-App ausliefert — also der Kopf
  der STARTSEITE. Vorher stand hier nur der Markenname und sonst nichts: keine
  Beschreibung, kein Canonical, kein Vorschaubild, und lang="en" auf einer
  deutschen Seite. Weil diese Datei alle Adressen ausser dem Blog beantwortet,
  hatte damit die gesamte Anwendung einen einzigen Titel und keine einzige
  Beschreibung.

  Jede andere Seite setzt ihren Kopf beim Rendern (src/components/Seo.jsx).
  Die Blogseiten kommen fertig vom Server (api/blog.php) und brauchen diese
  Datei nicht.

  In der Auszeichnung unten steht bewusst KEIN aggregateRating: Sterne in der
  Trefferliste sind verlockend, aber es gibt keine Bewertungen. Sie zu
  erfinden verstösst gegen Googles Richtlinien.
-->
