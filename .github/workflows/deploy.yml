# Bauen, prüfen, ausliefern — bei jedem Push auf main.
#
# Der Ablauf ersetzt genau das, was bisher von Hand passierte: `npm run build`,
# die beiden Prüfungen, und das Hochladen von `dist/` nach `public_html`.
#
# WAS ER NICHT ANFASST
# Es wird ausschliesslich in `public_html` geschrieben. Die Zugangsdaten
# (`invite-config.php`) und die Daten des Blogs (`orbylox-data/`) liegen EINE
# EBENE DARÜBER und sind damit ausser Reichweite — das war beim Aufräumen
# nach dem versehentlichen Löschen die Absicht, und hier zahlt es sich aus.
#
# WARUM OHNE `--delete`
# In `public_html/uploads` liegen die Dateien, die Nutzerinnen hochgeladen
# haben (siehe `api/upload.php`). Ein Abgleich mit Löschen würde sie beim
# ersten Lauf restlos entfernen: Sie stehen in keinem Build. Stattdessen wird
# nur überschrieben und ergänzt; alte Bündel räumt ein eigener Schritt nach
# 30 Tagen weg, wenn niemand mehr eine Seite von damals offen hat.

name: Ausliefern

on:
  push:
    branches: [main]
  workflow_dispatch:       # zusätzlich von Hand anstossbar

concurrency:
  group: auslieferung
  cancel-in-progress: false   # eine laufende Übertragung nie abbrechen

jobs:
  ausliefern:
    runs-on: ubuntu-latest

    # Einmal oben, nicht in jedem Schritt erneut.
    #
    # `secrets.X || vars.X`: GitHub fuehrt unter "Secrets and variables" zwei
    # getrennte Listen. Rechnername und Port sind keine Geheimnisse im engeren
    # Sinn und landen deshalb leicht unter "Variables" — `secrets.X` ist dann
    # leer, und im Protokoll steht `ssh-keyscan -p "" -H ""`. Genau daran ist
    # die Auslieferung gescheitert. Beide Listen zu lesen kostet nichts.
    #
    # Der Schluessel steht bewusst NICHT in dieser Reihe: Ein privater
    # Schluessel unter "Variables" waere unmaskiert im Protokoll.
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Bauen
        run: npm run build

      # Die Prüfungen laufen NACH dem Bauen und VOR dem Hochladen: Beide lesen
      # das gebaute CSS beziehungsweise die Modelle. Schlägt eine fehl, endet
      # der Ablauf hier — auf dem Server bleibt der vorige Stand stehen.
      - name: Theme prüfen
        run: npm run check:theme

      - name: Bewegungen prüfen
        run: npm run check:clips

      # Diese Prüfung braucht den Build nicht — sie liest den Quelltext. Sie
      # steht trotzdem hier, weil sie vergleicht, ob Seite und Cron dieselbe
      # Vorwarnzeit verwenden: Ein Auseinanderdriften merkt sonst niemand,
      # bis eine Frist ohne Vorwarnung abläuft.
      - name: Fristen prüfen
        run: npm run check:deadlines

      # Hält fest, was die erste Seite wiegt. Ein versehentlich fester Import
      # zieht eine ganze Seite samt Bibliotheken zurück ins Startbündel — das
      # sieht man im Quelltext nicht, auf dem Handy aber sofort.
      - name: Startbündel prüfen
        run: npm run check:bundle

      # Die Menü-Anordnung steht in den Konten der Leute. Ein umbenanntes
      # Modul oder eine verrutschte Reihenfolge fällt hier auf, nicht erst,
      # wenn jemandem sein eingerichtetes Menü durcheinandergerät.
      - name: Menü prüfen
        run: npm run check:menu

      # Dateien und Notizen teilen sich die Ordner-Sammlung. Hier faellt auf,
      # wenn ein Ordner im falschen Bereich landet oder die vorhandenen
      # Ordner ohne Art-Feld aus dem Dateibereich verschwinden.
      - name: Ordner prüfen
        run: npm run check:folders

      # Dieser Schritt sagt jetzt, WORAN es liegt.
      #
      # Vorher stand hier `ssh-keyscan … 2>/dev/null`: Der Befehl schlägt fehl,
      # wenn Rechnername oder Port leer sind oder der Server nicht antwortet —
      # und seine Begründung wurde weggeworfen. Im Protokoll stand dann nur
      # "exit code 1", ohne einen Hinweis, welches der fünf Geheimnisse fehlt.
      #
      # Nichts hiervon gibt den Schlüssel preis: Geprüft werden Länge, erste
      # Zeile und Rückgabewerte, ausgegeben wird "gesetzt" oder "LEER".
      - name: Schlüssel einrichten
        env:
          # Der Schlüssel NUR aus den Secrets. Läge er unter "Variables",
          # stünde er unmaskiert in jedem Protokoll — dieser Weg bleibt zu.
          # Die uebrigen vier stehen auf Job-Ebene.
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -u
          fehlt=0
          for name in SSH_KEY SSH_HOST SSH_PORT SSH_USER DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Das Geheimnis $name ist leer oder fehlt."
              fehlt=1
            else
              echo "$name: gesetzt"
            fi
          done
          if [ "$fehlt" = "1" ]; then
            echo "Nachtragen unter: Settings -> Secrets and variables -> Actions."
            echo "Achtung: Dort gibt es ZWEI Reiter. Der Ablauf liest beide,"
            echo "aber der Schluessel MUSS unter 'Secrets' stehen."
            exit 1
          fi

          mkdir -p ~/.ssh
          # `tr -d '\r'`: Ein unter Windows kopierter Schlüssel bringt
          # Wagenrückläufe mit. OpenSSH lehnt ihn dann als "invalid format" ab
          # — an einer Stelle, die nicht mehr nach der Ursache aussieht.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          zeilen=$(wc -l < ~/.ssh/id_deploy)
          echo "Schlüsseldatei: $zeilen Zeilen"
          if [ "$zeilen" -lt 3 ]; then
            echo "::error::Der Schlüssel hat nur $zeilen Zeile(n). Beim Einfügen"
            echo "gehen die Zeilenumbrüche oft verloren. Es muss der GESAMTE"
            echo "Inhalt der PRIVATEN Datei hinein — von '-----BEGIN' bis"
            echo "'-----END', mit allen Umbrüchen, ohne die .pub-Datei."
            exit 1
          fi
          if ! head -n 1 ~/.ssh/id_deploy | grep -q -- '-----BEGIN'; then
            echo "::error::Die erste Zeile ist kein '-----BEGIN …-----'."
            echo "Vermutlich steckt der öffentliche Schlüssel (.pub) im Geheimnis."
            exit 1
          fi

          # Laesst OpenSSH den Schluessel ueberhaupt lesen? `-P ''` verhindert,
          # dass eine Passphrase-Abfrage den Ablauf zum Stillstand bringt.
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_deploy > /dev/null 2>~/keyfehler.txt; then
            echo "::error::OpenSSH kann den Schlüssel nicht lesen."
            echo "Häufigste Gründe: Passphrase gesetzt (Automatik kann sie nicht"
            echo "eingeben) oder beim Kopieren etwas abgeschnitten."
            sed 's/[A-Za-z0-9+/=]\{20,\}/…/g' ~/keyfehler.txt   # nichts Langes durchlassen
            exit 1
          fi
          echo "Schlüssel lesbar."

          # Der eigentliche Stolperstein: Antwortet der Server auf diesem Port?
          # Dreimal versuchen, dann mit Begruendung aufgeben.
          for versuch in 1 2 3; do
            if ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>~/scanfehler.txt \
               && [ -s ~/.ssh/known_hosts ]; then
              echo "Serverschlüssel geholt (Versuch $versuch)."
              exit 0
            fi
            echo "Versuch $versuch fehlgeschlagen:"
            cat ~/scanfehler.txt || true
            sleep 5
          done
          echo "::error::Der Server antwortet nicht auf Port $SSH_PORT."
          echo "Zu prüfen: SSH_HOST (Rechnername, nicht die Web-Adresse) und"
          echo "SSH_PORT (bei Hostinger meist 65002, nicht 22)."
          exit 1

      - name: Hochladen
        run: |
          rsync -rlptz --omit-dir-times \
            --exclude '.DS_Store' \
            --exclude 'htaccess' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      # Alte Bündel aufräumen. Sie tragen einen Inhaltsstempel im Namen, sind
      # also nach einer Auslieferung unerreichbar — bis auf Seiten, die schon
      # offen sind. 30 Tage Schonfrist ist dafür reichlich.
      - name: Alte Bündel wegräumen
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_deploy \
            "$SSH_USER@$SSH_HOST" \
            "find '$DEPLOY_PATH/assets' -type f -mtime +30 -delete" || true

      - name: Nachsehen, was live ist
        run: |
          echo "Ausgeliefert wurde:"
          grep -o 'assets/index-[^\"]*' dist/index.html
